<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>[부레옥잠] 정빈 RPH V8.1</title>
    <link rel="icon" href="images/blocks/purple_berry_bush.png" type="image/png">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: lightblue;
            user-select: none;
            touch-action: manipulation;
        }

        .hotbar {
            z-index: 1000;
            max-width: 100%;
            width: 1220px;
            height: 140px;
            background-color: gray;
            padding: 0px;
            display: flex;
            justify-content: safe center;
            align-items: flex-end;
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            overflow-x: auto;
        }

        .slot {
            position: relative;
            flex-shrink: 0;
            background-color: lightgray;
            width: 100px;
            height: 100px;
            padding: 0px;
            margin: 10px;
            cursor: pointer;
        }

        .slot:hover {
            background-color: rgb(180, 180, 180);
        }

        #inventoryButton {
            background-color: lightyellow;
        }

        #inventoryButton:hover {
            background-color: rgb(220, 220, 180)
        }

        .slot img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        #inventoryButton:hover img {
            content: url("images/buttons/inventory_on.png");
        }

        #purple_berry_bush img {
            position: absolute;
            width: 128px;
            height: 128px;
            cursor: pointer;
        }

        .slot span {
            color: white;
            text-shadow:
                -2px -2px 0 #000,
                2px -2px 0 #000,
                -2px 2px 0 #000,
                2px 2px 0 #000;
            position: absolute;
            right: 0px;
            bottom: 0px;
            font-size: 32px;
            pointer-events: none;
        }

        #red_berry_bush img {
            position: absolute;
            width: 128px;
            height: 128px;
            cursor: pointer;
        }

        .slot:hover img {
            filter: brightness(90%);
        }

        #eatButton {
            font-size: 32px;
            width: 128px;
            height: 64px;
        }

        #sellButton {
            font-size: 32px;
            width: 128px;
            height: 64px;
        }

        #saveButton {
            font-size: 32px;
            width: 128px;
            height: 64px;
        }

        #loadButton {
            font-size: 32px;
            width: 192px;
            height: 64px;
        }

        #player {
            width: 128px;
            height: 128px;
            position: absolute;
            bottom: 150px;
            left: 0px;
            z-index: 999;
        }

        #id {
            position: absolute;
            width: 128px;
            height: 32px;
            left: 96px;
            top: 5px;
        }

        #pw {
            position: absolute;
            width: 128px;
            height: 32px;
            left: 128px;
            top: 47px;
        }

        span {
            position: absolute;
            font-size: 32px;
        }

        #menu {
            position: relative;
        }

        input {
            font-size: 32px;
            border-radius: 5px;
        }

        #login {
            position: absolute;
            width: 96px;
            height: 32px;
            font-size: 20px;
            top: 84px;
            border-radius: 5px;
        }

        #signup {
            position: absolute;
            width: 96px;
            height: 32px;
            font-size: 20px;
            top: 84px;
            left: 106px;
            border-radius: 5px;
        }

        #message {
            position: absolute;
            font-size: 48px;
            top: 64px;
        }

        #moreButtons {
            position: fixed;
        }

        #goldmessage {
            position: absolute;
            font-size: 48px;
            top: 16px;
        }

        #inventoryBox {
            position: relative;
            margin: 50px;
            width: calc(100vw - 100px);
            height: calc(100vh - 100px);
            background-color: gray;
            border-radius: 16px;
            border: 8px solid black;
        }

        #closeInventory {
            position: absolute;
            top: 0;
            right: 0;
            width: 64px;
            height: 64px;
            border-radius: 0px;
            background-color: red;
        }

        .pig {
            cursor: pointer;
            height: 128px;
            width: 128px;
            position: absolute;
            left: 896px;
            bottom: 150px;
            background: url('images/monsters/pig.png') no-repeat center/cover;
            z-index: 998;
        }

        button {
            cursor: pointer;
        }

        .healthBar {
            width: 138px;
            height: 32px;
            background-color: black;
            position: absolute;
            left: -5px;
            bottom: 133px;
        }

        .innerHealthBar {
            width: 128px;
            height: 22px;
            background-color: green;
            position: absolute;
            left: 5px;
            bottom: 5px;
            transition: width 0.25s;
        }

        .pigName {
            position: absolute;
            left: -5px;
            bottom: 140px;
            white-space: nowrap;
        }

        #logInLess {
            position: absolute;
            width: 280px;
            height: 32px;
            font-size: 20px;
            top: 121px;
            border-radius: 5px;
        }

        #villageLeader {
            position: absolute;
            z-index: 997;
            bottom: 150px;
            left: 768px;
            transition: 300ms;
        }

        #villageLeaderImg {
            width: 181px;
            height: 402px;
            cursor: pointer;
        }

        #bubble_villageLeaderImg {
            width: 256px;
            height: 256px;
            z-index: 99997;
            position: absolute;
            bottom: 169.9px;
            left: -269.9px;
            transform: rotate(-11.25deg);
        }

        #bubble_villageLeaderImg img {
            pointer-events: none;
            pointer-events: none;
            width: 256px;
            height: 256px;
        }

        #text_villageLeaderImg {
            pointer-events: none;
            position: absolute;
            left: 26.99px;
            top: 16.99px;
            font-size: 32px;
            pointer-events: none;
        }

        .villageLeaderImg_option {
            position: absolute;
            bottom: 100px;
            left: 26.99px;
            width: 64px;
        }

        #villageLeaderImg_option2 {
            position: absolute;
            left: 109.9px;
        }

        #joystick {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: #aaa;
            display: flex;
            justify-content: center;
            align-items: center;
            position: absolute;
            top: 160px;
            left: 60px;
            touch-action: none;
        }

        #stick {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #555;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div id="menu" class="menu">
        <span class="menu">아이디</span>
        <input id="id" class="menu">
        <span class="menu" style="top: 42px;">비밀번호</span>
        <input id="pw" class="menu">
        <button class="menu" id="login" onclick="logIn()">로그인</button>
        <button class="menu" id="signup" onclick="signUp()">회원가입</button>
        <button class="menu" id="logInLess">비로그인 상태로 플레이하기</button>
    </div>
    <div class="hotbar">
        <button class="slot" id="slot0">
            <img id="islot0">
            <span id="sslot0"></span>
        </button>
        <button class="slot" id="slot1">
            <img id="islot1">
            <span id="sslot1"></span>
        </button>
        <button class="slot" id="slot2">
            <img id="islot2">
            <span id="sslot2"></span>
        </button>
        <button class="slot" id="slot3">
            <img id="islot3">
            <span id="sslot3"></span>
        </button>
        <button class="slot" id="slot4">
            <img id="islot4">
            <span id="sslot4"></span>
        </button>
        <button class="slot" id="slot5">
            <img id="islot5">
            <span id="sslot5"></span>
        </button>
        <button class="slot" id="slot6">
            <img id="islot6">
            <span id="sslot6"></span>
        </button>
        <button class="slot" id="slot7">
            <img id="islot7">
            <span id="sslot7"></span>
        </button>
        <button class="slot" id="slot8">
            <img id="islot8">
            <span id="sslot8"></span>
        </button>
        <button class="slot" id="slot9">
            <img id="islot9">
            <span id="sslot9"></span>
        </button>
        <button class="slot" id="inventoryButton">
            <img src="images/buttons/inventory.png">
        </button>
    </div>
    <div id="map"></div>
    <div id="villageLeader">
        <div id="bubble_villageLeaderImg">
            <img id="bubble_villageLeaderImg_img" src="images/gui/speech_bubble.png">
            <span id="text_villageLeaderImg">안녕, 나는 마을 이장이라네.</span>
            <button id="villageLeaderImg_option1" class="villageLeaderImg_option">네</button>
            <button id="villageLeaderImg_option2" class="villageLeaderImg_option">아니오</button>
        </div>
        <img id="villageLeaderImg" src="images/npcs/마을 이장/1.png">
    </div>
    <div id="monsters"></div>
    <div id="moreButtons">
        <button id="eatButton">먹기(Q)</button>
        <button id="sellButton">팔기(W)</button>
        <button id="saveButton" onclick="updateInventory()">저장(O)</button>
        <button id="loadButton" onclick="loadInventory()">불러오기(P)</button>
        <h1 id="goldmessage">G: 로딩중...</h1>
        <h1 id="message"></h1>
        <div id="joystick">
            <div id="stick"></div>
        </div>
    </div>
    <img id="player" src="images/monsters/player.png">
    <div id="inventoryBox">
        <button id="closeInventory">X</button>
    </div>
    <audio id="audioPlayer"></audio>
    <script>
        let bgm = ''
        showAlert = false
        errorM = ''
        items =
        {
            purple_berry_bush: { types: ['block'], sellValue: 5, korean: '보랏빛 열매 덤불' },
            red_berry_bush: { types: ['block'], sellValue: 5, korean: '붉은빛 열매 덤불' },
            air: { types: [], sellValue: 0, korean: '공기' },
            purple_berry: { types: ['food'], sellValue: 5, korean: '보랏빛 열매' },
            red_berry: { types: ['food'], sellValue: 5, korean: '붉은빛 열매' },
            bush: { types: ['block'], sellValue: 0, korean: '덤불' },
            pork: { types: ['food'], sellValue: 10, korean: '삼겹살' },
            eichhornia_crassipes: { types: ['crash_when_eaten'], sellValue: 5, korean: '부레옥잠' }
        }
        b = {
            purple_berry: { clickEvent: 'pberry', collision: false, image: 'blocks/purple_berry_bush.png' },
            red_berry: { clickEvent: 'rberry', collision: false, image: 'blocks/red_berry_bush.png' },
            air: { clickEvent: 'none', collision: false, image: 'blocks/air.png' },
            grass_block: { clickEvent: 'none', collision: true, image: 'blocks/grass_block.png' },
            eichhornia_crassipes: { clickEvent: 'eichhornia_crassipes', collision: true, image: 'blocks/eichhornia_crassipes.png' }
        }
        map = [
            [],
            [b.purple_berry, b.purple_berry, b.red_berry, b.red_berry, b.eichhornia_crassipes, b.eichhornia_crassipes],
            [b.purple_berry, b.purple_berry, b.red_berry, b.red_berry, b.eichhornia_crassipes, b.eichhornia_crassipes],
            [b.grass_block, b.grass_block, b.grass_block, b.grass_block, b.grass_block, b.grass_block, b.grass_block, b.grass_block, b.grass_block, b.grass_block, b.grass_block, b.grass_block, b.grass_block, b.grass_block]
        ]
        const joystick = document.querySelector("#joystick");
        const stick = document.querySelector("#stick");
        let joystickValue = 0;
        let isDragging = false;
        joystick.addEventListener("pointerdown", () => {
            isDragging = true;
        });
        joystick.addEventListener("pointermove", (e) => {
            if (!isDragging) return;
            const rect = joystick.getBoundingClientRect();
            let x = e.clientX - rect.left - rect.width / 2;
            const max = (rect.width - stick.offsetWidth) / 2;
            x = Math.max(-max, Math.min(max, x));
            stick.style.transform = `translateX(${x}px)`;
            joystickValue = x / max;
        });
        document.addEventListener("pointerup", () => {
            isDragging = false;
            stick.style.transform = "translateX(0px)";
            joystickValue = 0;
        });
        let objectId = 0;
        function loadMap() {
            document.getElementById('map').innerHTML = ``
            for (let i = 0; i < map.length; i++) {
                for (let j = 0; j < map[i].length; j++) {
                    document.getElementById('bubble_villageLeaderImg').style.display = 'none'
                    const block = document.createElement('img')
                    block.src = 'images/' + map[i][j].image
                    block.className = map[i][j].clickEvent
                    block.style.position = 'absolute'
                    block.style.width = '128px'
                    block.style.height = '128px'
                    block.style.bottom = `${(map.length - i - 1) * 128 + 22}px`
                    block.style.left = `${j * 128}px`
                    if (map[i][j].clickEvent != 'none') {
                        block.style.cursor = 'pointer'
                    };
                    block.id = 'block' + objectId
                    objectId++
                    block.addEventListener('click', () => {
                        click(map[i][j].clickEvent, block.src, block.id)
                    })
                    document.getElementById('map').appendChild(block)
                    console.log(`(${j},${map.length - i - 1}): ${JSON.stringify(map[i][j])}`)
                }
            }
        }
        loadMap()
        timers = {}
        npcMouthCool = 200;
        npcMouth = 0;
        pigC = []
        pigId = 0
        pigHp = []
        window.addEventListener('pointerdown', () => {
            bgm = new Audio('audios/songs/노래_물음표2.m4a')
            bgm.loop = true
            bgm.volume = 0.5
            bgm.play()
        }, { once: true });
        function addPig() {
            pigC.push(0)
            pigHp.push(10)
            const pig = document.createElement('div')
            pig.className = "pig"
            pig.id = "pig" + pigId
            const pigName = document.createElement('span')
            pigName.className = 'pigName'
            pigName.textContent = 'Lv. 1 돼지'
            pig.appendChild(pigName)
            const healthBar = document.createElement('div')
            healthBar.className = "healthBar"
            healthBar.id = "hpig" + pigId
            const innerHealthBar = document.createElement('div')
            innerHealthBar.className = "innerHealthBar"
            innerHealthBar.id = "ihpig" + pigId
            innerHealthBar.style.width = '128px';
            healthBar.appendChild(innerHealthBar)
            pig.appendChild(healthBar)
            document.getElementById('monsters').appendChild(pig)
            pigId++

            document.querySelectorAll('.pig').forEach(element => {
                element.addEventListener('click', function () {
                    const sound = new Audio('audios/sfxs/카홉.m4a')
                    sound.play()
                    element.style.background = "linear-gradient(rgba(255, 0, 0, 0.5), rgba(255, 0, 0, 0.5)), url('images/monsters/pig.png') no-repeat center/cover"
                    pigHp[element.id.replace("pig", "")] -= 1;
                    document.getElementById('ihpig' + element.id.replace("pig", "")).style.width = +document.getElementById('ihpig' + element.id.replace("pig", "")).style.width.replace('px', '') - (128 / 10) + 'px';
                    document.getElementById('ihpig' + element.id.replace("pig", "")).style.backgroundColor = 'lightgreen';
                    setTimeout(function () {
                        element.style.background = "url('images/monsters/pig.png') no-repeat center/cover"
                        document.getElementById('ihpig' + element.id.replace("pig", "")).style.backgroundColor = 'green';
                    }, 250)
                    if (+document.getElementById('ihpig' + element.id.replace("pig", "")).style.width.replace('px', '') == 0) {
                        pigC[element.id.replace("pig", "")] = 0;
                        document.getElementById('ihpig' + element.id.replace("pig", "")).style.width = '128px';
                        for (let i = 0; i < 10; i++) {
                            if (inventory[i][0] == 'pork') {
                                if (!(inventory[i][1] > 99)) {
                                    inventory[i][1]++;
                                    document.getElementById('islot' + i).src = "images/items/pork.png";
                                    document.getElementById('sslot' + i).textContent = inventory[i][1];
                                    break;
                                }
                            };
                            if (inventory[i][0] == 'air') {
                                if (!(inventory[i][1] > 99)) {
                                    inventory[i][0] = 'pork';
                                    document.getElementById('islot' + i).src = "images/items/pork.png";
                                    document.getElementById('sslot' + i).textContent = inventory[i][1];
                                    break;
                                }
                            };
                        }
                    }
                })
            })
        };
        addPig();
        window.addEventListener('beforeunload', (event) => {
            event.preventDefault();
            event.returnValue = '';
        });
        let userid = -1;
        document.querySelectorAll('*').forEach(element => {
            if (['HTML', 'BODY', 'HEAD'].includes(element.tagName)) {
                return;
            }
            if (!element.classList.contains('menu')) {
                element.style.display = 'none';
            }
        });
        let cool = 5000
        let speed = 0.05
        let movement = [0, 0]
        let playerC = [0, 0]
        let inventory =
        {
            0: ['air', 1],
            1: ['air', 1],
            2: ['air', 1],
            3: ['air', 1],
            4: ['air', 1],
            5: ['air', 1],
            6: ['air', 1],
            7: ['air', 1],
            8: ['air', 1],
            9: ['air', 1],
            10: ['air', 1],
            gold: 0
        }
        let selected = 10;
        function click(clickEvent, src, id) {
            if (clickEvent == 'pberry') {
                if (!src.includes("images/blocks/bush.png")) {
                    const sound = new Audio('audios/sfxs/투.m4a')
                    sound.play()
                    document.getElementById(id).src = "images/blocks/bush.png";
                    setTimeout(() => {
                        document.getElementById(id).src = "images/blocks/purple_berry_bush.png";
                    }, cool)
                    for (let i = 0; i < 10; i++) {
                        if (inventory[i][0] == 'purple_berry') {
                            if (!(inventory[i][1] > 99)) {
                                inventory[i][1]++;
                                document.getElementById('islot' + i).src = "images/items/purple_berry.png";
                                document.getElementById('sslot' + i).textContent = inventory[i][1];
                                break;
                            }
                        };
                        if (inventory[i][0] == 'air') {
                            if (!(inventory[i][1] > 99)) {
                                inventory[i][0] = 'purple_berry';
                                document.getElementById('islot' + i).src = "images/items/purple_berry.png";
                                document.getElementById('sslot' + i).textContent = inventory[i][1];
                                break;
                            }
                        };
                    }
                }
            }
            if (clickEvent == 'rberry') {
                if (!src.includes("images/blocks/bush.png")) {
                    const sound = new Audio('audios/sfxs/투.m4a')
                    sound.play()
                    document.getElementById(id).src = "images/blocks/bush.png";
                    setTimeout(() => {
                        document.getElementById(id).src = "images/blocks/red_berry_bush.png";
                    }, cool)
                    for (let i = 0; i < 10; i++) {
                        if (inventory[i][0] == 'red_berry') {
                            if (!(inventory[i][1] > 99)) {
                                inventory[i][1]++;
                                document.getElementById('islot' + i).src = "images/items/red_berry.png";
                                document.getElementById('sslot' + i).textContent = inventory[i][1];
                                break;
                            }
                        };
                        if (inventory[i][0] == 'air') {
                            if (!(inventory[i][1] > 99)) {
                                inventory[i][0] = 'red_berry';
                                document.getElementById('islot' + i).src = "images/items/red_berry.png";
                                document.getElementById('sslot' + i).textContent = inventory[i][1];
                                break;
                            }
                        };
                    }
                }
            }
            if (clickEvent == 'eichhornia_crassipes') {
                if (!src.includes("images/blocks/bush.png")) {
                    const sound = new Audio('audios/sfxs/투.m4a')
                    sound.play()
                    document.getElementById(id).src = "images/blocks/bush.png";
                    setTimeout(() => {
                        document.getElementById(id).src = "images/blocks/eichhornia_crassipes.png";
                    }, cool)
                    for (let i = 0; i < 10; i++) {
                        if (inventory[i][0] == 'eichhornia_crassipes') {
                            if (!(inventory[i][1] > 99)) {
                                inventory[i][1]++;
                                document.getElementById('islot' + i).src = "images/items/eichhornia_crassipes.png";
                                document.getElementById('sslot' + i).textContent = inventory[i][1];
                                break;
                            }
                        };
                        if (inventory[i][0] == 'air') {
                            if (!(inventory[i][1] > 99)) {
                                inventory[i][0] = 'eichhornia_crassipes';
                                document.getElementById('islot' + i).src = "images/items/eichhornia_crassipes.png";
                                document.getElementById('sslot' + i).textContent = inventory[i][1];
                                break;
                            }
                        };
                    }
                }
            }
        }
        document.querySelectorAll('.slot').forEach(element => {
            element.addEventListener('click', function () {
                document.querySelectorAll('.slot').forEach(element => {
                    element.style.filter = 'brightness(100%)'
                });
                element.style.filter = 'brightness(50%)';
                selected = +element.id[4];
            });
        });
        document.getElementById('eatButton').addEventListener('click', function () {
            if (inventory[selected][0] == 'air') {
                document.getElementById("message").textContent = "아이템을 들고 먹어주세요.";
                setTimeout(function () {
                    document.getElementById("message").textContent = ""
                }, 1000)
            }
            else if (items[inventory[selected][0]].types.includes('food')) {
                const sound = new Audio('audios/sfxs/카홉.m4a')
                sound.play()
                inventory[selected][1] -= 1;
                document.getElementById('sslot' + selected).textContent = inventory[selected][1];
                if (inventory[selected][1] == 0) {
                    inventory[selected][1] = 1;
                    inventory[selected][0] = 'air'
                    document.getElementById('islot' + selected).src = 'images/items/air.png'
                    document.getElementById('sslot' + selected).textContent = 1;
                }
                document.getElementById("message").textContent = "효과는 미미했다.";
                setTimeout(function () {
                    document.getElementById("message").textContent = ""
                }, 1000)
            }
            else if (items[inventory[selected][0]].types.includes('crash_when_eaten')) {
                const sound = new Audio('audios/sfxs/카홉.m4a')
                sound.play()
                document.querySelectorAll('img').forEach(element => {
                    element.src = 'images/blocks/red_berry_bush_old.png'
                })
                document.querySelectorAll('span').forEach(element => {
                    a = ''
                    for (let i = 0; i < element.textContent.length; i++) {
                        a += '🯷'
                    }
                    element.textContent = a
                })
                document.querySelectorAll('h1').forEach(element => {
                    a = ''
                    for (let i = 0; i < element.textContent.length; i++) {
                        a += '🯷'
                    }
                    element.textContent = a
                })
                document.querySelectorAll('button').forEach(element => {
                    element.style.background = `url('images/blocks/red_berry_bush_old.png')`
                    element.style.backgroundSize = 'cover'
                })
                document.getElementById('joystick').innerHTML = `<img src='images/blocks/red_berry_bush_old.png'>`
                document.getElementsByClassName('hotbar')[0].style.background = `url('images/blocks/red_berry_bush_old.png')`
                document.querySelectorAll('.pig').forEach(element => {
                    element.style.background = `url('images/blocks/red_berry_bush_old.png')`
                    element.style.backgroundSize = 'cover'
                })
                document.querySelectorAll('.healthBar').forEach(element => {
                    element.style.background = `url('images/blocks/red_berry_bush_old.png')`
                    element.style.backgroundSize = 'cover'
                })
                a = ''; for (let i = 0; i < document.getElementById('eatButton').textContent.length; i++) { a += '🯷' }
                document.getElementById('eatButton').textContent = a
                a = ''; for (let i = 0; i < document.getElementById('sellButton').textContent.length; i++) { a += '🯷' }
                document.getElementById('sellButton').textContent = a
                a = ''; for (let i = 0; i < document.getElementById('saveButton').textContent.length; i++) { a += '🯷' }
                document.getElementById('saveButton').textContent = a
                a = ''; for (let i = 0; i < document.getElementById('loadButton').textContent.length; i++) { a += '🯷' }
                document.getElementById('loadButton').textContent = a
                setTimeout(() => {
                    try {
                        Audio()
                    } catch (error) {
                        catchError(error)
                    }
                }, 3000)
            }
            else {
                document.getElementById("message").textContent = "음식을 들고 먹어주세요.";
                setTimeout(function () {
                    document.getElementById("message").textContent = ""
                }, 1000)
            }
        });
        document.getElementById('sellButton').addEventListener('click', function () {
            if (inventory[selected][0] == 'air') {
                document.getElementById("message").textContent = "아이템을 들고 판매해주세요.";
                setTimeout(function () {
                    document.getElementById("message").textContent = ""
                }, 1000)
            }
            else {
                try {
                    const sound = new Audio('audios/sfxs/투.m4a')
                    sound.play()
                    document.getElementById("message").textContent = items[inventory[selected][0]].korean + " 판매 완료(" + items[inventory[selected][0]].sellValue + "G)";
                    inventory.gold += items[inventory[selected][0]].sellValue;
                    inventory[selected][1] -= 1;
                    document.getElementById('sslot' + selected).textContent = inventory[selected][1];
                    if (inventory[selected][1] == 0) {
                        inventory[selected][1] = 1;
                        inventory[selected][0] = 'air'
                        document.getElementById('islot' + selected).src = 'images/items/air.png'
                        document.getElementById('sslot' + selected).textContent = 1
                    }
                    setTimeout(function () {
                        document.getElementById("message").textContent = ""
                    }, 1000)
                    document.getElementById('goldmessage').textContent = "G: " + inventory.gold + "G"
                }
                catch (error) {
                    alert(`게임에 해당 아이템의 판매 정보가 없습니다.
${error}`)
                }
            }
        });
        document.addEventListener('keydown', (event) => {
            if (event.key.toUpperCase() == 'Q') {
                document.getElementById('eatButton').click();
            }
            if (event.key.toUpperCase() == 'W') {
                document.getElementById('sellButton').click();
            }
            if (event.key.toUpperCase() == 'O') {
                updateInventory()
            }
            if (event.key.toUpperCase() == 'P') {
                loadInventory()
            }
            if (/^[1-9]$/.test(event.key)) {
                document.getElementById('slot' + (event.key - 1)).click();
            }
            if (event.key == '0') {
                document.getElementById('slot9').click();
            }
            if (event.key.toUpperCase() == 'A') {
                movement[0] = -speed
            }
            if (event.key.toUpperCase() == 'D') {
                movement[0] = speed
            }
        });
        document.addEventListener('keyup', (event) => {
            if (event.key.toUpperCase() == 'A' || event.key.toUpperCase() == 'D') {
                movement[0] = 0;
            }
        });
        function update() {
            if (movement[0] != 0 || joystickValue != 0) {
                playerC[0] += movement[0] + joystickValue * speed;
                document.getElementById('player').style.transform = `translateX(${playerC[0] * 128}px) translateY(${playerC[1] * - 128}px)`;
            }
            document.querySelectorAll('.pig').forEach(element => {
                pigC[element.id.replace('pig', '')] += Math.random() * 10 - 5
                element.style.transform = `translateX(${pigC[element.id.replace('pig', '')]}px)`
            })
            requestAnimationFrame(update);
        }
        requestAnimationFrame(update);
        WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzYula9H4kTDRT5i6eEuDRVbbJzBD0pz44QSAih98XpsZGvCFSbypM0XIf4zR50ocB42Q/exec"
        function signUp() {
            const id = document.getElementById("id").value;
            const script = document.createElement("script");
            script.src = WEB_APP_URL
                + "?callback=signUpCheck"
                + "&id=" + encodeURIComponent(id)
                + "&mode=signUp"
            script.onerror = function () {
                alert("검색 요청에 실패했습니다.");
            };
            document.body.appendChild(script);
        }
        function signUpCheck(result) {
            if (result.exists) {
                alert('이미 존재하는 아이디입니다.');
            } else {
                const id = document.getElementById("id").value;
                const pw = document.getElementById("pw").value;
                console.log(id)
                console.log(pw)
                fetch(WEB_APP_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "text/plain;charset=utf-8"
                    },
                    body: JSON.stringify({
                        mode: "signUp",
                        id: id,
                        pw: pw
                    })
                })
                    .then(response => response.text())
                    .then(result => {
                        console.log(result);
                        document.getElementById("message").textContent = result;
                        setTimeout(function () {
                            document.getElementById("message").textContent = ""
                        }, 1000)
                    })
                    .catch(error => {
                        console.error(error);
                        alert("요청 또는 응답 처리에 실패했습니다.");
                    });
                alert('회원가입에 성공했습니다.');
            }
        }
        function logIn() {
            const id = document.getElementById("id").value;
            const pw = document.getElementById("pw").value;
            const script = document.createElement("script");
            script.src = WEB_APP_URL
                + "?callback=logInCheck"
                + "&id=" + encodeURIComponent(id)
                + "&pw=" + encodeURIComponent(pw)
                + "&mode=logIn"
            script.onerror = function () {
                alert("검색 요청에 실패했습니다:");
            };
            document.body.appendChild(script);
        }
        function hideThings() {
            document.querySelectorAll('*').forEach(element => {
                if (['HTML', 'BODY', 'HEAD'].includes(element.tagName)) {
                    return;
                }
                if (element.classList.contains('menu')) {
                    element.style.display = 'none';
                }
            });
            document.querySelectorAll('*').forEach(element => {
                if (['HTML', 'BODY', 'HEAD'].includes(element.tagName)) {
                    return;
                }
                if (!element.classList.contains('menu')) {
                    element.style.display = '';
                }
            });
            document.getElementById('inventoryBox').style.display = 'none';
            document.getElementById('bubble_villageLeaderImg').style.display = 'none';
            document.getElementById('text_villageLeaderImg').style.display = 'none';
        }
        function logInCheck(result) {
            console.log(result)
            if (result.exists) {
                userid = result.userid;
                alert('로그인에 성공했습니다.')
                loadInventory();
                setInterval(function () {
                    forceLoad();
                    onlineCheck();
                }, 1000)
                hideThings();
            } else {
                alert('아이디나 비밀번호를 다시 확인해 주십시오.')
            }
        }
        function updateInventory() {
            document.getElementById('message').textContent = "저장 중..."
            fetch(WEB_APP_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "text/plain;charset=utf-8"
                },
                body: JSON.stringify({ mode: "updateInventory", inventory: inventory, userid: userid })
            })
                .then(response => response.text())
                .then(result => {
                    console.log(result);
                    if (showAlert) {
                        alert(result)
                    }
                    document.getElementById("message").textContent = result;
                    setTimeout(function () {
                        document.getElementById("message").textContent = ""
                    }, 1000)
                })
                .catch(error => {
                    console.error(error);
                    document.getElementById("message").textContent = "요청 또는 응답 처리에 실패했습니다.";
                    setTimeout(function () {
                        document.getElementById("message").textContent = ""
                    }, 1000)
                });
        }
        function loadInventory() {
            document.getElementById('message').textContent = "불러오는 중..."
            const id = document.getElementById("id").value;
            const pw = document.getElementById("pw").value;
            const script = document.createElement("script");
            script.src = WEB_APP_URL
                + "?callback=loadInventoryMain"
                + "&mode=loadInventory"
                + "&userid=" + userid
            script.onerror = function () {
                alert("오류가 발생했습니다.");
            };
            document.body.appendChild(script);
        }
        function loadInventoryMain(result) {
            inventory = result.inventory;
            for (let i = 0; i < 10; i++) {
                document.getElementById('islot' + i).src = "images/items/" + (inventory[i])[0] + ".png"
                document.getElementById('sslot' + i).textContent = ((inventory[i])[1] + []);
            }
            document.getElementById("message").textContent = result.message;
            setTimeout(function () {
                document.getElementById("message").textContent = ""
            }, 1000)
            document.getElementById('goldmessage').textContent = "G: " + inventory.gold + "G"
        }
        function forceLoad() {
            const id = document.getElementById("id").value;
            const script = document.createElement("script");
            script.src = WEB_APP_URL
                + "?callback=forceLoadCheck"
                + "&mode=forceLoad"
            script.onerror = function () {
                document.getElementById("message").textContent = "검색 요청에 실패했습니다.";
                setTimeout(function () {
                    document.getElementById("message").textContent = ""
                }, 1000)
            };
            document.body.appendChild(script);
        }
        function forceLoadCheck(result) {
            if (result == "l") {
                loadInventory()
                document.getElementById("message").textContent = "개발자에 의해 강제로 불러와지는 중...";
                setTimeout(function () {
                    document.getElementById("message").textContent = ""
                }, 1000)
            }
            if (result == "s") {
                updateInventory()
                document.getElementById("message").textContent = "개발자에 의해 강제로 저장되는 중...";
                setTimeout(function () {
                    document.getElementById("message").textContent = ""
                }, 1000)
            }
        }
        document.getElementById('inventoryButton').addEventListener('click', function () {
            document.getElementById('inventoryBox').style.display == 'none' ?
                document.getElementById('inventoryBox').style.display = '' :
                document.getElementById('inventoryBox').style.display = 'none';
        })
        function onlineCheck() {
            fetch(WEB_APP_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "text/plain;charset=utf-8"
                },
                body: JSON.stringify({ mode: "onlineCheck", userid: userid })
            })
                .catch(error => {
                    console.error(error);
                    document.getElementById("message").textContent = "요청 또는 응답 처리에 실패했습니다.";
                    setTimeout(function () {
                        document.getElementById("message").textContent = ""
                    }, 1000)
                });
        }
        document.getElementById('logInLess').addEventListener('click', function () {
            hideThings();
            document.getElementById('goldmessage').textContent = 'G: 0G';
            userid = 15;
        })
        function npcMouthMove(npcName) {
            document.getElementById('text_' + npcName).textContent = `안녕, 나는 마을 이장이라네.`
            document.querySelectorAll('.' + npcName + '_option').forEach(element => {
                element.style.display = 'none';
            })
            document.getElementById('bubble_' + npcName).style.display = '';
            document.getElementById('text_' + npcName).style.display = '';
            timers[npcName] = setInterval(function () {
                document.getElementById(npcName).src = "images/npcs/마을 이장/" + (npcMouth % 4 + 1) + ".png"
                npcMouth++;
            }, npcMouthCool)
            setTimeout(function () {
                document.getElementById('text_' + npcName).textContent = `잘 지내나?`
                document.querySelectorAll('.' + npcName + '_option').forEach(element => {
                    element.style.display = '';
                })
            }, 3000)
        }
        function npcMouthStop(npcName) {
            document.getElementById('bubble_' + npcName).style.display = 'none';
            document.getElementById('text_' + npcName).style.display = 'none';
            clearInterval(timers[npcName])
        }
        document.getElementById('villageLeaderImg').addEventListener('click', function () {
            if (document.getElementById('bubble_' + this.id).style.display == 'none') {
                npcMouthMove(this.id)
                const sound = new Audio('audios/npcs/마을 이장/마을 이장-1.m4a')
                sound.play()
                setTimeout(() => {
                    const sound = new Audio('audios/npcs/마을 이장/마을 이장-2.m4a')
                    sound.play()
                }, 3000)
            }
            else {
                npcMouthStop(this.id);
            }
        })
        document.getElementById('villageLeaderImg_option2').addEventListener('click', function () {
            const npcName = 'villageLeaderImg'
            document.getElementById(npcName + '_option1').style.display = 'none';
            document.getElementById(npcName + '_option2').style.display = 'none';
            const sound = new Audio('audios/npcs/마을 이장/마을 이장-2-2.m4a')
            sound.play()
            document.getElementById('text_villageLeaderImg').textContent = `장난치나? 싸우자!`
            document.getElementById(npcName + '_option1').style.display = 'none';
            document.getElementById(npcName + '_option2').style.display = 'none';
            setTimeout(function () {
                document.getElementById('bubble_' + npcName).style.display = 'none';
                clearInterval(timers[npcName])
                document.querySelector('#villageLeader').style.transform = 'translateY(-100px)'
                setTimeout(() => {
                    document.querySelector('#villageLeader').style.transform = 'translateY(0px)'
                    setTimeout(() => {
                        npcMouthMove("villageLeaderImg")
                        const sound = new Audio('audios/npcs/마을 이장/마을 이장-3.m4a')
                        sound.play()
                        document.getElementById('bubble_' + npcName).style.display = '';
                        document.getElementById('text_villageLeaderImg').textContent = `그냥 안 싸울래`
                        setTimeout(() => {
                            npcMouthStop("villageLeaderImg")
                            document.getElementById('bubble_' + npcName).style.display = 'none';
                        }, 3000)
                    }, 300)
                }, 2000)
            }, 3000)
        })
        document.getElementById('villageLeaderImg_option1').addEventListener('click', function () {
            const npcName = 'villageLeaderImg'
            document.getElementById(npcName + '_option1').style.display = 'none';
            document.getElementById(npcName + '_option2').style.display = 'none';
            const sound = new Audio('audios/npcs/마을 이장/마을 이장-2-1.m4a')
            sound.play()
            document.getElementById('text_villageLeaderImg').textContent = `그렇군. 가던 길 가렴~`
            setTimeout(function () {
                const npcName = 'villageLeaderImg'
                document.getElementById('bubble_' + npcName).style.display = 'none';
                document.getElementById('text_' + npcName).style.display = 'none';
                clearInterval(timers[npcName])
            }, 3000)
        })
        function catchError(error) {
            errorM = error
            bgm.pause()
            bgm.currentTime = 0
            bgm = new Audio('audios/songs/노래_든든.m4a')
            bgm.loop = true
            bgm.volume = 0.5
            bgm.play()
            const sound = new Audio('audios/sfxs/오류 발생.m4a')
            sound.play()
            showAlert = true
            updateInventory()
            document.querySelectorAll('*').forEach(element => {
                if (['HTML', 'BODY', 'HEAD'].includes(element.tagName)) {
                    return;
                }
                element.style.display = 'none';
            });
            const errorMessage = document.createElement('h1')
            errorMessage.textContent = errorM
            document.body.appendChild(errorMessage)
            selected = -1
        }
    </script>
