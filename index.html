<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: lightblue;
        }

        .hotbar {
            max-width: 100%;
            width: 1220px;
            height: 140px;
            background-color: gray;
            padding: 0px;
            display: flex;
            justify-content: safe center;
            align-items: flex-end;
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            overflow-x: auto;
        }

        .slot {
            position: relative;
            flex-shrink: 0;
            background-color: lightgray;
            width: 100px;
            height: 100px;
            padding: 0px;
            margin: 10px;
            cursor: pointer;
        }

        .slot:hover {
            background-color: rgb(180, 180, 180);
        }

        #inventoryButton {
            background-color: lightyellow;
        }

        #inventoryButton:hover {
            background-color: rgb(220, 220, 180)
        }

        .slot img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        #inventoryButton:hover img {
            content: url("images/buttons/inventory_on.png");
        }

        #purple_berry_bush img {
            position: absolute;
            width: 128px;
            height: 128px;
            cursor: pointer;
        }

        #pberry1 {
            left: 0px;
            bottom: 150px;
        }

        #pberry2 {
            left: 128px;
            bottom: 150px;
        }

        #pberry3 {
            left: 0px;
            bottom: 278px;
        }

        #pberry4 {
            left: 128px;
            bottom: 278px;
        }

        .slot span {
            position: absolute;
            right: 0px;
            bottom: 0px;
            font-size: 32px;
            pointer-events: none;
        }
    </style>
</head>

<body>
    <div class="hotbar">
        <button class="slot" id="slot1">
            <img id="islot0">
            <span id="sslot0"></span>
        </button>
        <button class="slot" id="slot2">
            <img id="islot1">
            <span id="sslot1"></span>
        </button>
        <button class="slot" id="slot3">
            <img id="islot2">
            <span id="sslot2"></span>
        </button>
        <button class="slot" id="slot4">
            <img id="islot3">
            <span id="sslot3"></span>
        </button>
        <button class="slot" id="slot5">
            <img id="islot4">
            <span id="sslot4"></span>
        </button>
        <button class="slot" id="slot6">
            <img id="islot5">
            <span id="sslot5"></span>
        </button>
        <button class="slot" id="slot7">
            <img id="islot6">
            <span id="sslot6"></span>
        </button>
        <button class="slot" id="slot8">
            <img id="islot7">
            <span id="sslot7"></span>
        </button>
        <button class="slot" id="slot9">
            <img id="islot8">
            <span id="sslot8"></span>
        </button>
        <button class="slot" id="slot0">
            <img id="islot9">
            <span id="sslot9"></span>
        </button>
        <button class="slot" id="inventoryButton">
            <img src="images/buttons/inventory.png">
        </button>
    </div>
    <div id="map">
        <div id="purple_berry_bush">
            <img id="pberry1" class="pberry" src="images/blocks/purple_berry_bush.png">
            <img id="pberry2" class="pberry" src="images/blocks/purple_berry_bush.png">
            <img id="pberry3" class="pberry" src="images/blocks/purple_berry_bush.png">
            <img id="pberry4" class="pberry" src="images/blocks/purple_berry_bush.png">
        </div>
    </div>
    <script>
        let inventory =
        {
            0: ['air', 1],
            1: ['air', 1],
            2: ['air', 1],
            3: ['air', 1],
            4: ['air', 1],
            5: ['air', 1],
            6: ['air', 1],
            7: ['air', 1],
            8: ['air', 1],
            9: ['air', 1]
        }
        document.querySelectorAll('.pberry').forEach(element => {
            element.addEventListener('click', function () {
                if (this.src.includes("images/blocks/purple_berry_bush.png")) {
                    this.src = "images/blocks/bush.png";
                    setTimeout(() => {
                        this.src = "images/blocks/purple_berry_bush.png";
                    }, 5000)
                    for (let i = 0; i < 10; i++) {
                        if (inventory[i][0] == 'purple_berry') {
                            if (inventory[i][1] < 100) {
                                inventory[i][1]++;
                                document.getElementById('islot' + i).src = "images/blocks/purple_berry_bush.png";
                                document.getElementById('sslot' + i).textContent = inventory[i][1];
                                break;
                            }
                        };
                        if (inventory[i][0] == 'air') {
                            if (inventory[i][1] < 100) {
                                inventory[i][0] = 'purple_berry';
                                document.getElementById('islot' + i).src = "images/blocks/purple_berry_bush.png";
                                document.getElementById('sslot' + i).textContent = inventory[i][1];
                                break;
                            }
                        };
                    }
                }
            });
        })
    </script>
</body>

</html>
