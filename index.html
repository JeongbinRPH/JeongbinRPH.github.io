<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>정빈 RPH V3.0</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: lightblue;
        }

        .hotbar {
            max-width: 100%;
            width: 1220px;
            height: 140px;
            background-color: gray;
            padding: 0px;
            display: flex;
            justify-content: safe center;
            align-items: flex-end;
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            overflow-x: auto;
        }

        .slot {
            position: relative;
            flex-shrink: 0;
            background-color: lightgray;
            width: 100px;
            height: 100px;
            padding: 0px;
            margin: 10px;
            cursor: pointer;
        }

        .slot:hover {
            background-color: rgb(180, 180, 180);
        }

        #inventoryButton {
            background-color: lightyellow;
        }

        #inventoryButton:hover {
            background-color: rgb(220, 220, 180)
        }

        .slot img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        #inventoryButton:hover img {
            content: url("images/buttons/inventory_on.png");
        }

        #purple_berry_bush img {
            position: absolute;
            width: 128px;
            height: 128px;
            cursor: pointer;
        }

        #pberry1 {
            left: 0px;
            bottom: 150px;
        }

        #pberry2 {
            left: 128px;
            bottom: 150px;
        }

        #pberry3 {
            left: 0px;
            bottom: 278px;
        }

        #pberry4 {
            left: 128px;
            bottom: 278px;
        }

        .slot span {
            color: white;
            text-shadow:
                -2px -2px 0 #000,
                2px -2px 0 #000,
                -2px 2px 0 #000,
                2px 2px 0 #000;
            position: absolute;
            right: 0px;
            bottom: 0px;
            font-size: 32px;
            pointer-events: none;
        }

        #ground {
            position: absolute;
            width: 100vw;
            height: 150px;
            bottom: 0px;
            background-color: lightgreen;
        }

        #red_berry_bush img {
            position: absolute;
            width: 128px;
            height: 128px;
            cursor: pointer;
        }

        #rberry1 {
            left: 256px;
            bottom: 150px;
        }

        #rberry2 {
            left: 384px;
            bottom: 150px;
        }

        #rberry3 {
            left: 256px;
            bottom: 278px;
        }

        #rberry4 {
            left: 384px;
            bottom: 278px;
        }

        .slot:hover img {
            filter: brightness(90%);
        }

        #eatButton {
            font-size: 32px;
            width: 128px;
            height: 64px;
        }

        #player {
            width: 128px;
            height: 128px;
            background-color: rgb(230, 200, 150);
            position: absolute;
            bottom: 150px;
            left: 512px;
        }

        #leftB {
            position: absolute;
            bottom: 288px;
            left: 502px;
            height: 64px;
            width: 64px;
        }

        #rightB {
            position: absolute;
            bottom: 288px;
            left: 586px;
            height: 64px;
            width: 64px;
        }
    </style>
</head>

<body>
    <div id="ground"></div>
    <div class="hotbar">
        <button class="slot" id="slot0">
            <img id="islot0">
            <span id="sslot0"></span>
        </button>
        <button class="slot" id="slot1">
            <img id="islot1">
            <span id="sslot1"></span>
        </button>
        <button class="slot" id="slot2">
            <img id="islot2">
            <span id="sslot2"></span>
        </button>
        <button class="slot" id="slot3">
            <img id="islot3">
            <span id="sslot3"></span>
        </button>
        <button class="slot" id="slot4">
            <img id="islot4">
            <span id="sslot4"></span>
        </button>
        <button class="slot" id="slot5">
            <img id="islot5">
            <span id="sslot5"></span>
        </button>
        <button class="slot" id="slot6">
            <img id="islot6">
            <span id="sslot6"></span>
        </button>
        <button class="slot" id="slot7">
            <img id="islot7">
            <span id="sslot7"></span>
        </button>
        <button class="slot" id="slot8">
            <img id="islot8">
            <span id="sslot8"></span>
        </button>
        <button class="slot" id="slot9">
            <img id="islot9">
            <span id="sslot9"></span>
        </button>
        <button class="slot" id="inventoryButton">
            <img src="images/buttons/inventory.png">
        </button>
    </div>
    <div id="map">
        <div id="purple_berry_bush">
            <img id="pberry1" class="pberry" src="images/blocks/purple_berry_bush.png">
            <img id="pberry2" class="pberry" src="images/blocks/purple_berry_bush.png">
            <img id="pberry3" class="pberry" src="images/blocks/purple_berry_bush.png">
            <img id="pberry4" class="pberry" src="images/blocks/purple_berry_bush.png">
        </div>
        <div id="red_berry_bush">
            <img id="rberry1" class="rberry" src="images/blocks/red_berry_bush.png">
            <img id="rberry2" class="rberry" src="images/blocks/red_berry_bush.png">
            <img id="rberry3" class="rberry" src="images/blocks/red_berry_bush.png">
            <img id="rberry4" class="rberry" src="images/blocks/red_berry_bush.png">
        </div>
    </div>
    <div id="player"></div>
    <div id="moreButtons">
        <button id="eatButton">먹기(E)</button>
        <button id="leftB">
            < </button>
                <button id="rightB">></button>
    </div>
    <script>
        let speed = 0.05
        let movement = [0, 0]
        let playerC = [0, 0]
        let items =
        {
            'purple_berry': 'food',
            'red_berry': 'food'
        }
        let inventory =
        {
            0: ['air', 1],
            1: ['air', 1],
            2: ['air', 1],
            3: ['air', 1],
            4: ['air', 1],
            5: ['air', 1],
            6: ['air', 1],
            7: ['air', 1],
            8: ['air', 1],
            9: ['air', 1],
            10: ['air', 1]
        }
        let selected = 10;
        document.querySelectorAll('.pberry').forEach(element => {
            element.addEventListener('click', function () {
                if (this.src.includes("images/blocks/purple_berry_bush.png")) {
                    this.src = "images/blocks/bush.png";
                    setTimeout(() => {
                        this.src = "images/blocks/purple_berry_bush.png";
                    }, 5000)
                    for (let i = 0; i < 10; i++) {
                        if (inventory[i][0] == 'purple_berry') {
                            if (inventory[i][1] < 100) {
                                inventory[i][1]++;
                                document.getElementById('islot' + i).src = "images/blocks/purple_berry_bush.png";
                                document.getElementById('sslot' + i).textContent = inventory[i][1];
                                break;
                            }
                        };
                        if (inventory[i][0] == 'air') {
                            if (inventory[i][1] < 100) {
                                inventory[i][0] = 'purple_berry';
                                document.getElementById('islot' + i).src = "images/blocks/purple_berry_bush.png";
                                document.getElementById('sslot' + i).textContent = inventory[i][1];
                                break;
                            }
                        };
                    }
                }
            });
        })
        document.querySelectorAll('.rberry').forEach(element => {
            element.addEventListener('click', function () {
                if (this.src.includes("images/blocks/red_berry_bush.png")) {
                    this.src = "images/blocks/bush.png";
                    setTimeout(() => {
                        this.src = "images/blocks/red_berry_bush.png";
                    }, 5000)
                    for (let i = 0; i < 10; i++) {
                        if (inventory[i][0] == 'red_berry') {
                            if (!(inventory[i][1] > 99)) {
                                inventory[i][1]++;
                                document.getElementById('islot' + i).src = "images/blocks/red_berry_bush.png";
                                document.getElementById('sslot' + i).textContent = inventory[i][1];
                                break;
                            }
                        };
                        if (inventory[i][0] == 'air') {
                            if (!(inventory[i][1] > 99)) {
                                inventory[i][0] = 'red_berry';
                                document.getElementById('islot' + i).src = "images/blocks/red_berry_bush.png";
                                document.getElementById('sslot' + i).textContent = inventory[i][1];
                                break;
                            }
                        };
                    }
                }
            });
        })
        document.querySelectorAll('.slot').forEach(element => {
            element.addEventListener('click', function () {
                document.querySelectorAll('.slot').forEach(element => {
                    element.style.filter = 'brightness(100%)'
                });
                element.style.filter = 'brightness(50%)';
                selected = +element.id[4];
            });
        });
        document.getElementById('eatButton').addEventListener('click', function () {
            if (inventory[selected][0] == 'air') {
                alert('아이템을 들고 먹어주세요.')
            }
            else if (items[inventory[selected][0]].includes('food')) {
                inventory[selected][1] -= 1;
                document.getElementById('sslot' + selected).textContent = inventory[selected][1];
                if (inventory[selected][1] == 0) {
                    inventory[selected][0] = 'air'
                    document.getElementById('islot' + selected).src = 'images/blocks/air.png'
                    document.getElementById('sslot' + selected).textContent = ''
                }
                alert('효과는 미미했다.')
            }
            else {
                alert('음식을 들고 먹어주세요.')
            }
        });
        document.addEventListener('keydown', (event) => {
            if (event.key.toUpperCase() == 'E') {
                document.getElementById('eatButton').click();
            }
            if (/^[1-9]$/.test(event.key)) {
                document.getElementById('slot' + (event.key - 1)).click();
            }
            if (event.key == '0') {
                document.getElementById('slot9').click();
            }
            if (event.key.toUpperCase() == 'A') {
                movement[0] = -speed
            }
            if (event.key.toUpperCase() == 'D') {
                movement[0] = speed
            }
        });
        document.addEventListener('keyup', (event) => {
            if (event.key.toUpperCase() == 'A' || event.key.toUpperCase() == 'D') {
                movement[0] = 0;
            }
        });
        function update() {
            if (movement[0] != 0) {
                playerC[0] += movement[0];
                document.getElementById('player').style.transform = `translateX(${playerC[0] * 128}px) translateY(${playerC[1] * 128}px)`;
                document.getElementById('leftB').style.transform = `translateX(${playerC[0] * 128}px) translateY(${playerC[1] * 128}px)`;
                document.getElementById('rightB').style.transform = `translateX(${playerC[0] * 128}px) translateY(${playerC[1] * 128}px)`;
            }
            requestAnimationFrame(update);
        }
        requestAnimationFrame(update);
        document.getElementById('leftB').addEventListener('click', function () {
            playerC[0] -= 1;
            document.getElementById('player').style.transform = `translateX(${playerC[0] * 128}px) translateY(${playerC[1] * 128}px)`;
            document.getElementById('leftB').style.transform = `translateX(${playerC[0] * 128}px) translateY(${playerC[1] * 128}px)`;
            document.getElementById('rightB').style.transform = `translateX(${playerC[0] * 128}px) translateY(${playerC[1] * 128}px)`;
        });
        document.getElementById('rightB').addEventListener('click', function () {
            playerC[0]++;
            document.getElementById('player').style.transform = `translateX(${playerC[0] * 128}px) translateY(${playerC[1] * 128}px)`;
            document.getElementById('leftB').style.transform = `translateX(${playerC[0] * 128}px) translateY(${playerC[1] * 128}px)`;
            document.getElementById('rightB').style.transform = `translateX(${playerC[0] * 128}px) translateY(${playerC[1] * 128}px)`;
        });
    </script>
</body>

</html>
