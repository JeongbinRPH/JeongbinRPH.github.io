<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <title>[판매 기능] 정빈 RPH V4.0</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background: lightblue;
        }

        .hotbar {
            max-width: 100%;
            width: 1220px;
            height: 140px;
            background-color: gray;
            padding: 0px;
            display: flex;
            justify-content: safe center;
            align-items: flex-end;
            position: fixed;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            overflow-x: auto;
        }

        .slot {
            position: relative;
            flex-shrink: 0;
            background-color: lightgray;
            width: 100px;
            height: 100px;
            padding: 0px;
            margin: 10px;
            cursor: pointer;
        }

        .slot:hover {
            background-color: rgb(180, 180, 180);
        }

        #inventoryButton {
            background-color: lightyellow;
        }

        #inventoryButton:hover {
            background-color: rgb(220, 220, 180)
        }

        .slot img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: block;
        }

        #inventoryButton:hover img {
            content: url("images/buttons/inventory_on.png");
        }

        #purple_berry_bush img {
            position: absolute;
            width: 128px;
            height: 128px;
            cursor: pointer;
        }

        #pberry1 {
            left: 0px;
            bottom: 150px;
        }

        #pberry2 {
            left: 128px;
            bottom: 150px;
        }

        #pberry3 {
            left: 0px;
            bottom: 278px;
        }

        #pberry4 {
            left: 128px;
            bottom: 278px;
        }

        .slot span {
            color: white;
            text-shadow:
                -2px -2px 0 #000,
                2px -2px 0 #000,
                -2px 2px 0 #000,
                2px 2px 0 #000;
            position: absolute;
            right: 0px;
            bottom: 0px;
            font-size: 32px;
            pointer-events: none;
        }

        #ground {
            position: absolute;
            width: 100vw;
            height: 150px;
            bottom: 0px;
            background-color: lightgreen;
        }

        #red_berry_bush img {
            position: absolute;
            width: 128px;
            height: 128px;
            cursor: pointer;
        }

        #rberry1 {
            left: 256px;
            bottom: 150px;
        }

        #rberry2 {
            left: 384px;
            bottom: 150px;
        }

        #rberry3 {
            left: 256px;
            bottom: 278px;
        }

        #rberry4 {
            left: 384px;
            bottom: 278px;
        }

        .slot:hover img {
            filter: brightness(90%);
        }

        #eatButton {
            font-size: 32px;
            width: 128px;
            height: 64px;
        }

        #sellButton {
            font-size: 32px;
            width: 128px;
            height: 64px;
        }

        #saveButton {
            font-size: 32px;
            width: 128px;
            height: 64px;
        }

        #loadButton {
            font-size: 32px;
            width: 192px;
            height: 64px;
        }

        #player {
            width: 128px;
            height: 128px;
            background-color: rgb(230, 200, 150);
            position: absolute;
            bottom: 150px;
            left: 512px;
        }

        #leftB {
            position: absolute;
            bottom: 288px;
            left: 502px;
            height: 64px;
            width: 64px;
            font-size: 32px;
        }

        #rightB {
            position: absolute;
            bottom: 288px;
            left: 586px;
            height: 64px;
            width: 64px;
            font-size: 32px;
        }

        #id {
            position: absolute;
            width: 128px;
            height: 32px;
            left: 96px;
            top: 5px;
        }

        #pw {
            position: absolute;
            width: 128px;
            height: 32px;
            left: 128px;
            top: 47px;
        }

        span {
            position: absolute;
            font-size: 32px;
        }

        #menu {
            position: relative;
        }

        input {
            font-size: 32px;
            border-radius: 5px;
        }

        #login {
            position: absolute;
            width: 96px;
            height: 32px;
            font-size: 20px;
            top: 84px;
            border-radius: 5px;
        }

        #signup {
            position: absolute;
            width: 96px;
            height: 32px;
            font-size: 20px;
            top: 84px;
            left: 106px;
            border-radius: 5px;
        }

        #message {
            position: absolute;
            font-size: 48px;
            top: 64px;
        }

        #moreButtons {
            position: fixed;
        }

        #goldmessage {
            position: absolute;
            font-size: 48px;
            top: 16px;
        }
    </style>
</head>

<body>
    <div id="menu" class="menu">
        <span class="menu">아이디</span>
        <input id="id" class="menu">
        <span class="menu" style="top: 42px;">비밀번호</span>
        <input id="pw" class="menu">
        <button class="menu" id="login" onclick="logIn()">로그인</button>
        <button class="menu" id="signup" onclick="signUp()">회원가입</button>
    </div>
    <div id="ground"></div>
    <div class="hotbar">
        <button class="slot" id="slot0">
            <img id="islot0">
            <span id="sslot0"></span>
        </button>
        <button class="slot" id="slot1">
            <img id="islot1">
            <span id="sslot1"></span>
        </button>
        <button class="slot" id="slot2">
            <img id="islot2">
            <span id="sslot2"></span>
        </button>
        <button class="slot" id="slot3">
            <img id="islot3">
            <span id="sslot3"></span>
        </button>
        <button class="slot" id="slot4">
            <img id="islot4">
            <span id="sslot4"></span>
        </button>
        <button class="slot" id="slot5">
            <img id="islot5">
            <span id="sslot5"></span>
        </button>
        <button class="slot" id="slot6">
            <img id="islot6">
            <span id="sslot6"></span>
        </button>
        <button class="slot" id="slot7">
            <img id="islot7">
            <span id="sslot7"></span>
        </button>
        <button class="slot" id="slot8">
            <img id="islot8">
            <span id="sslot8"></span>
        </button>
        <button class="slot" id="slot9">
            <img id="islot9">
            <span id="sslot9"></span>
        </button>
        <button class="slot" id="inventoryButton">
            <img src="images/buttons/inventory.png">
        </button>
    </div>
    <div id="map">
        <div id="purple_berry_bush">
            <img id="pberry1" class="pberry" src="images/blocks/purple_berry_bush.png">
            <img id="pberry2" class="pberry" src="images/blocks/purple_berry_bush.png">
            <img id="pberry3" class="pberry" src="images/blocks/purple_berry_bush.png">
            <img id="pberry4" class="pberry" src="images/blocks/purple_berry_bush.png">
        </div>
        <div id="red_berry_bush">
            <img id="rberry1" class="rberry" src="images/blocks/red_berry_bush.png">
            <img id="rberry2" class="rberry" src="images/blocks/red_berry_bush.png">
            <img id="rberry3" class="rberry" src="images/blocks/red_berry_bush.png">
            <img id="rberry4" class="rberry" src="images/blocks/red_berry_bush.png">
        </div>
    </div>
    <div id="player"></div>
    <div id="moreButtons">
        <button id="eatButton">먹기(Q)</button>
        <button id="sellButton">팔기(W)</button>
        <button id="saveButton" onclick="updateInventory()">저장(O)</button>
        <button id="loadButton" onclick="loadInventory()">불러오기(P)</button>
        <h1 id="goldmessage">G: 로딩중...</h1>
        <h1 id="message"></h1>
    </div>
    <button id="leftB">←</button>
    <button id="rightB">→</button>
    <script>
        window.addEventListener('beforeunload', (event) => {
            event.preventDefault();
            event.returnValue = '';
        });

        let userid = -1;
        document.querySelectorAll('*').forEach(element => {
            if (['HTML', 'BODY', 'HEAD'].includes(element.tagName)) {
                return;
            }
            if (!element.classList.contains('menu')) {
                element.style.display = 'none';
            }
        });
        let cool = 5000
        let speed = 0.05
        let movement = [0, 0]
        let playerC = [0, 0]
        let items =
        {
            'purple_berry_bush': { types: ['food'], sellValue: 5, korean: '보랏빛 열매 덤불' },
            'red_berry_bush': { types: ['food'], sellValue: 5, korean: '붉은빛 열매 덤불' },
            'air': { types: [], sellValue: 0, korean: '공기' }
        }
        let inventory =
        {
            0: ['air', 1],
            1: ['air', 1],
            2: ['air', 1],
            3: ['air', 1],
            4: ['air', 1],
            5: ['air', 1],
            6: ['air', 1],
            7: ['air', 1],
            8: ['air', 1],
            9: ['air', 1],
            10: ['air', 1],
            gold: 0
        }
        let selected = 10;
        document.querySelectorAll('.pberry').forEach(element => {
            element.addEventListener('click', function () {
                if (this.src.includes("images/blocks/purple_berry_bush.png")) {
                    this.src = "images/blocks/bush.png";
                    setTimeout(() => {
                        this.src = "images/blocks/purple_berry_bush.png";
                    }, cool)
                    for (let i = 0; i < 10; i++) {
                        if (inventory[i][0] == 'purple_berry_bush') {
                            if (!(inventory[i][1] > 99)) {
                                inventory[i][1]++;
                                document.getElementById('islot' + i).src = "images/blocks/purple_berry_bush.png";
                                document.getElementById('sslot' + i).textContent = inventory[i][1];
                                break;
                            }
                        };
                        if (inventory[i][0] == 'air') {
                            if (!(inventory[i][1] > 99)) {
                                inventory[i][0] = 'purple_berry_bush';
                                document.getElementById('islot' + i).src = "images/blocks/purple_berry_bush_bush.png";
                                document.getElementById('sslot' + i).textContent = inventory[i][1];
                                break;
                            }
                        };
                    }
                }
            });
        })
        document.querySelectorAll('.rberry').forEach(element => {
            element.addEventListener('click', function () {
                if (this.src.includes("images/blocks/red_berry_bush.png")) {
                    this.src = "images/blocks/bush.png";
                    setTimeout(() => {
                        this.src = "images/blocks/red_berry_bush.png";
                    }, cool)
                    for (let i = 0; i < 10; i++) {
                        if (inventory[i][0] == 'red_berry_bush') {
                            if (!(inventory[i][1] > 99)) {
                                inventory[i][1]++;
                                document.getElementById('islot' + i).src = "images/blocks/red_berry_bush.png";
                                document.getElementById('sslot' + i).textContent = inventory[i][1];
                                break;
                            }
                        };
                        if (inventory[i][0] == 'air') {
                            if (!(inventory[i][1] > 99)) {
                                inventory[i][0] = 'red_berry_bush';
                                document.getElementById('islot' + i).src = "images/blocks/red_berry_bush_bush.png";
                                document.getElementById('sslot' + i).textContent = inventory[i][1];
                                break;
                            }
                        };
                    }
                }
            });
        })
        document.querySelectorAll('.slot').forEach(element => {
            element.addEventListener('click', function () {
                document.querySelectorAll('.slot').forEach(element => {
                    element.style.filter = 'brightness(100%)'
                });
                element.style.filter = 'brightness(50%)';
                selected = +element.id[4];
            });
        });
        document.getElementById('eatButton').addEventListener('click', function () {
            if (inventory[selected][0] == 'air') {
                document.getElementById("message").textContent = "아이템을 들고 먹어주세요.";
                setTimeout(function () {
                    document.getElementById("message").textContent = ""
                }, 1000)
            }
            else if (items[inventory[selected][0]].types.includes('food')) {
                inventory[selected][1] -= 1;
                document.getElementById('sslot' + selected).textContent = inventory[selected][1];
                if (inventory[selected][1] == 0) {
                    inventory[selected][1] = 1;
                    inventory[selected][0] = 'air'
                    document.getElementById('islot' + selected).src = 'images/blocks/air.png'
                    document.getElementById('sslot' + selected).textContent = 1;
                }
                document.getElementById("message").textContent = "효과는 미미했다.";
                setTimeout(function () {
                    document.getElementById("message").textContent = ""
                }, 1000)
            }
            else {
                document.getElementById("message").textContent = "음식을 들고 먹어주세요.";
                setTimeout(function () {
                    document.getElementById("message").textContent = ""
                }, 1000)
            }
        });
        document.getElementById('sellButton').addEventListener('click', function () {
            if (inventory[selected][0] == 'air') {
                document.getElementById("message").textContent = "아이템을 들고 판매해주세요.";
                setTimeout(function () {
                    document.getElementById("message").textContent = ""
                }, 1000)
            }
            else {
                document.getElementById("message").textContent = items[inventory[selected][0]].korean + " 판매 완료(" + items[inventory[selected][0]].sellValue + "G)";
                inventory.gold += items[inventory[selected][0]].sellValue;
                inventory[selected][1] -= 1;
                document.getElementById('sslot' + selected).textContent = inventory[selected][1];
                if (inventory[selected][1] == 0) {
                    inventory[selected][1] = 1;
                    inventory[selected][0] = 'air'
                    document.getElementById('islot' + selected).src = 'images/blocks/air.png'
                    document.getElementById('sslot' + selected).textContent = 1
                }
                setTimeout(function () {
                    document.getElementById("message").textContent = ""
                }, 1000)
                document.getElementById('goldmessage').textContent = "G: " + inventory.gold + "G"
            }
        });
        document.addEventListener('keydown', (event) => {
            if (event.key.toUpperCase() == 'Q') {
                document.getElementById('eatButton').click();
            }
            if (event.key.toUpperCase() == 'W') {
                document.getElementById('sellButton').click();
            }
            if (event.key.toUpperCase() == 'O') {
                updateInventory()
            }
            if (event.key.toUpperCase() == 'P') {
                loadInventory()
            }
            if (/^[1-9]$/.test(event.key)) {
                document.getElementById('slot' + (event.key - 1)).click();
            }
            if (event.key == '0') {
                document.getElementById('slot9').click();
            }
            if (event.key.toUpperCase() == 'A') {
                movement[0] = -speed
            }
            if (event.key.toUpperCase() == 'D') {
                movement[0] = speed
            }
        });
        document.addEventListener('keyup', (event) => {
            if (event.key.toUpperCase() == 'A' || event.key.toUpperCase() == 'D') {
                movement[0] = 0;
            }
        });
        function update() {
            if (movement[0] != 0) {
                playerC[0] += movement[0];
                document.getElementById('player').style.transform = `translateX(${playerC[0] * 128}px) translateY(${playerC[1] * 128}px)`;
                document.getElementById('leftB').style.transform = `translateX(${playerC[0] * 128}px) translateY(${playerC[1] * 128}px)`;
                document.getElementById('rightB').style.transform = `translateX(${playerC[0] * 128}px) translateY(${playerC[1] * 128}px)`;
            }
            requestAnimationFrame(update);
        }
        requestAnimationFrame(update);
        document.getElementById('leftB').addEventListener('click', function () {
            playerC[0] -= 1;
            document.getElementById('player').style.transform = `translateX(${playerC[0] * 128}px) translateY(${playerC[1] * 128}px)`;
            document.getElementById('leftB').style.transform = `translateX(${playerC[0] * 128}px) translateY(${playerC[1] * 128}px)`;
            document.getElementById('rightB').style.transform = `translateX(${playerC[0] * 128}px) translateY(${playerC[1] * 128}px)`;
        });
        document.getElementById('rightB').addEventListener('click', function () {
            playerC[0]++;
            document.getElementById('player').style.transform = `translateX(${playerC[0] * 128}px) translateY(${playerC[1] * 128}px)`;
            document.getElementById('leftB').style.transform = `translateX(${playerC[0] * 128}px) translateY(${playerC[1] * 128}px)`;
            document.getElementById('rightB').style.transform = `translateX(${playerC[0] * 128}px) translateY(${playerC[1] * 128}px)`;
        });
        WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzYula9H4kTDRT5i6eEuDRVbbJzBD0pz44QSAih98XpsZGvCFSbypM0XIf4zR50ocB42Q/exec"

        function signUp() {
            const id = document.getElementById("id").value;
            const script = document.createElement("script");
            script.src = WEB_APP_URL
                + "?callback=signUpCheck"
                + "&id=" + encodeURIComponent(id)
                + "&mode=signUp"
            script.onerror = function () {
                alert("검색 요청에 실패했습니다.");
            };
            document.body.appendChild(script);
        }
        function signUpCheck(result) {
            if (result.exists) {
                alert('이미 존재하는 아이디입니다.');
            } else {
                const id = document.getElementById("id").value;
                const pw = document.getElementById("pw").value;
                console.log(id)
                console.log(pw)
                fetch(WEB_APP_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "text/plain;charset=utf-8"
                    },
                    body: JSON.stringify({
                        mode: "signUp",
                        id: id,
                        pw: pw
                    })
                })
                    .then(response => response.text())
                    .then(result => {
                        console.log(result);
                        document.getElementById("message").textContent = result;
                        setTimeout(function () {
                            document.getElementById("message").textContent = ""
                        }, 1000)
                    })
                    .catch(error => {
                        console.error(error);
                        alert("요청 또는 응답 처리에 실패했습니다.");
                    });
                alert('회원가입에 성공했습니다.');
            }
        }
        function logIn() {
            const id = document.getElementById("id").value;
            const pw = document.getElementById("pw").value;
            const script = document.createElement("script");
            script.src = WEB_APP_URL
                + "?callback=logInCheck"
                + "&id=" + encodeURIComponent(id)
                + "&pw=" + encodeURIComponent(pw)
                + "&mode=logIn"
            script.onerror = function () {
                alert("검색 요청에 실패했습니다:");
            };
            document.body.appendChild(script);
        }
        function logInCheck(result) {
            console.log(result)
            if (result.exists) {
                userid = result.userid;
                alert('로그인에 성공했습니다.')
                document.querySelectorAll('*').forEach(element => {
                    if (['HTML', 'BODY', 'HEAD'].includes(element.tagName)) {
                        return;
                    }
                    if (element.classList.contains('menu')) {
                        element.style.display = 'none';
                    }
                });
                document.querySelectorAll('*').forEach(element => {
                    if (['HTML', 'BODY', 'HEAD'].includes(element.tagName)) {
                        return;
                    }
                    if (!element.classList.contains('menu')) {
                        element.style.display = '';
                    }
                });

                loadInventory();
                setInterval(forceLoad, 1000)
            } else {
                alert('아이디나 비밀번호를 다시 확인해 주십시오.')
            }
        }
        function updateInventory() {
            document.getElementById('message').textContent = "저장 중..."
            fetch(WEB_APP_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "text/plain;charset=utf-8"
                },
                body: JSON.stringify({ mode: "updateInventory", inventory: inventory, userid: userid })
            })
                .then(response => response.text())
                .then(result => {
                    console.log(result);
                    document.getElementById("message").textContent = result;
                    setTimeout(function () {
                        document.getElementById("message").textContent = ""
                    }, 1000)
                })
                .catch(error => {
                    console.error(error);
                    document.getElementById("message").textContent = "요청 또는 응답 처리에 실패했습니다.";
                    setTimeout(function () {
                        document.getElementById("message").textContent = ""
                    }, 1000)
                });
        }
        function loadInventory() {
            document.getElementById('message').textContent = "불러오는 중..."
            const id = document.getElementById("id").value;
            const pw = document.getElementById("pw").value;
            const script = document.createElement("script");
            script.src = WEB_APP_URL
                + "?callback=loadInventoryMain"
                + "&mode=loadInventory"
                + "&userid=" + userid
            script.onerror = function () {
                alert("오류가 발생했습니다.");
            };
            //console.log(script)
            document.body.appendChild(script);
        }
        function loadInventoryMain(result) {
            inventory = result.inventory;
            for (let i = 0; i < 10; i++) {
                document.getElementById('islot' + i).src = "images/items/" + (inventory[i])[0] + ".png"
                document.getElementById('sslot' + i).textContent = ((inventory[i])[1] + []);
            }
            document.getElementById("message").textContent = result.message;
            setTimeout(function () {
                document.getElementById("message").textContent = ""
            }, 1000)
            document.getElementById('goldmessage').textContent = "G: " + inventory.gold + "G"
        }
        function forceLoad() {
            const id = document.getElementById("id").value;
            const script = document.createElement("script");
            script.src = WEB_APP_URL
                + "?callback=forceLoadCheck"
                + "&mode=forceLoad"
            script.onerror = function () {
                document.getElementById("message").textContent = "검색 요청에 실패했습니다.";
                setTimeout(function () {
                    document.getElementById("message").textContent = ""
                }, 1000)
            };
            document.body.appendChild(script);
        }
        function forceLoadCheck(result) {
            if (result == "l") {
                loadInventory()
                document.getElementById("message").textContent = "개발자에 의해 강제로 불러와졌습니다.";
                setTimeout(function () {
                    document.getElementById("message").textContent = ""
                }, 1000)
            }
            if (result == "s") {
                updateInventory()
                document.getElementById("message").textContent = "개발자에 의해 강제로 저장되었습니다.";
                setTimeout(function () {
                    document.getElementById("message").textContent = ""
                }, 1000)
            }
        }
    </script>
</body>

</html>
